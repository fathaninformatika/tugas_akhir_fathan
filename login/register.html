<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Minimalist Register Form</title>
    <meta name="description" content="Dark-theme registration form with glowing neon accents, parallax orbs and crisp focus states.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">⚡</div>
                <h2>Create Account</h2>
                <p>Join our community</p>
            </div>
            
            <form class="login-form" id="registerForm">
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" placeholder="Nama Pengguna .." required="required">
                        <label for="username">Nama Pengguna</label>
                        <span class="input-line"></span>
                    </div>
                    <span class="error-message" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="Email .." required="required">
                        <label for="email">Email</label>
                        <span class="input-line"></span>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Password .." required="required">
                        <label for="password">Password</label>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <span class="toggle-icon"></span>
                        </button>
                        <span class="input-line"></span>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <div class="remember-wrapper">
                        <input type="checkbox" id="terms" name="terms">
                        <label for="terms" class="checkbox-label">
                            <span class="custom-checkbox"></span>
                            I agree to the Terms & Conditions
                        </label>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">Register</span>
                    <span class="btn-loader"></span>
                    <span class="btn-glow"></span>
                </button>
            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn google-btn">
                    <span class="social-icon google-icon"></span>
                    <span>Sign up with Google</span>
                </button>
                <button type="button" class="social-btn apple-btn">
                    <span class="social-icon apple-icon"></span>
                    <span>Sign up with Apple</span>
                </button>
            </div>

            <div class="signup-link">
                <p>Already have an account? <a href="index.html">Sign In</a></p>
            </div>

            <div class="success-message" id="successMessage">
                <div class="success-icon">✓</div>
                <h3>Registration successful!</h3>
                <p>Redirecting to login...</p>
            </div>
        </div>
        
        <div class="background-effects">
            <div class="glow-orb glow-orb-1"></div>
            <div class="glow-orb glow-orb-2"></div>
            <div class="glow-orb glow-orb-3"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
